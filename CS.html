<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Camera Status Checker</title>
</head>

<body>

    <h1>Camera Status Checker</h1>

    <button id="check">
        カメラを調査
    </button>

    <pre id="result">未調査</pre>

    <script>

        const checkButton = document.getElementById("check");
        const result = document.getElementById("result");

        checkButton.addEventListener("click", async () => {

            try {

                // カメラへのアクセス
                const stream =
                    await navigator.mediaDevices.getUserMedia({
                        video: true
                    });

                // 使用しているカメラのトラック
                const track =
                    stream.getVideoTracks()[0];

                // カメラが報告している能力
                const capabilities =
                    track.getCapabilities();

                // 現在の設定
                const settings =
                    track.getSettings();

                const maxWidth =
                    capabilities.width?.max ?? "不明";

                const maxHeight =
                    capabilities.height?.max ?? "不明";

                const minWidth =
                    capabilities.width?.min ?? "不明";

                const minHeight =
                    capabilities.height?.min ?? "不明";

                const currentWidth =
                    settings.width ?? "不明";

                const currentHeight =
                    settings.height ?? "不明";

                const frameRate =
                    settings.frameRate ?? "不明";

                const cameraName =
                    track.label || "不明";

                const text = `
Camera Status
==============================

Camera
${cameraName}

Maximum Resolution
${maxWidth} × ${maxHeight}

Minimum Resolution
${minWidth} × ${minHeight}

Current Resolution
${currentWidth} × ${currentHeight}

Current FPS
${frameRate}

==============================
Generated by Camera Status Checker
`;

                // 画面に表示
                result.textContent = text;

                // TXTファイル生成
                const blob =
                    new Blob(
                        [text],
                        { type: "text/plain;charset=utf-8" }
                    );

                const url =
                    URL.createObjectURL(blob);

                // ダウンロード
                const a =
                    document.createElement("a");

                a.href = url;
                a.download = "Camera Status.txt";

                a.click();

                // 後片付け
                URL.revokeObjectURL(url);

                // カメラ停止
                track.stop();

            } catch (error) {

                result.textContent =
                    "カメラを取得できませんでした。\n\n" +
                    error.name + "\n" +
                    error.message;
            }

        });

    </script>

</body>
</html>
